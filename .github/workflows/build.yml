name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # 手动触发构建（不经过 check 每日限流，用于验证修复等场景）
  workflow_dispatch:

jobs:
  # 每天仅当日第一次 push 触发构建；pull_request 不受限制
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      skip: ${{ steps.check_today.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Check today's build status
        id: check_today
        shell: bash
        run: |
          today=$(date -u +%Y-%m-%d)
          runs=$(gh run list --branch "${{ github.ref_name }}" --workflow build.yml --limit 20 --json status,createdAt --jq "[.[] | select(.status == \"completed\" and (.createdAt | startswith(\"$today\")))] | length")
          if [ "$runs" -gt 0 ]; then
            echo "Today's build already completed ($runs run(s) found). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No completed build found for today. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check
    if: |
      always() &&
      (github.event_name != 'push' || needs.check.outputs.skip != 'true')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install dependencies (vcpkg)
        shell: powershell
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"

          if (!(Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            git -C $vcpkgRoot checkout 75672db6bd812b060482b0f00b5a16b18a0c0f07
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }

          & "$vcpkgRoot\vcpkg.exe" install ixwebsocket nlohmann-json zlib mbedtls kissfft --triplet ${{ matrix.arch }}-windows --classic
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $installDir = "$vcpkgRoot\installed\${{ matrix.arch }}-windows"
          Write-Host "VCPKG_INSTALLED_DIR=$installDir"
          echo "VCPKG_INSTALLED_DIR=$installDir" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -B build-${{ matrix.arch }} -S . `
            -A ${{ matrix.arch }} `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-${{ matrix.arch }} --config Release -- /v:minimal

      - name: Copy VC++ Redist DLLs
        shell: powershell
        run: |
          # 直接用 msvc-dev-cmd 注入的 VCToolsRedistDir 定位 CRT，不再依赖 cl.exe 路径推导
          # （arm64 job 的 PATH 指向 HostARM64\ARM64，在 x64 runner 上该目录不存在，
          #  导致 Get-Command cl.exe 失败、整个复制被静默跳过）
          $arch = "${{ matrix.arch }}"
          $crtBase = $env:VCToolsRedistDir
          if (-not $crtBase) { throw "VCToolsRedistDir not set" }

          $crtDir = Join-Path $crtBase "$arch\Microsoft.VC143.CRT"
          if (!(Test-Path $crtDir)) {
            $crtDir = Join-Path $crtBase "onecore\$arch\Microsoft.VC143.CRT"
          }
          if (!(Test-Path $crtDir)) {
            # 显式失败而非静默降级，避免产物缺 CRT 却标 success
            throw "VC++ CRT dir not found under $crtBase for arch $arch"
          }

          Write-Host "Copying VC++ CRT DLLs from: $crtDir"
          Copy-Item -Path "$crtDir\msvcp140.dll" -Destination "moeKoe-taskbar-lyrics\$arch\" -Force
          Copy-Item -Path "$crtDir\vcruntime140.dll" -Destination "moeKoe-taskbar-lyrics\$arch\" -Force
          Copy-Item -Path "$crtDir\vcruntime140_1.dll" -Destination "moeKoe-taskbar-lyrics\$arch\" -Force
          Write-Host "Copied to moeKoe-taskbar-lyrics\$arch\:"
          Get-ChildItem "moeKoe-taskbar-lyrics\$arch" -Filter *.dll | Select-Object -ExpandProperty Name

      - name: Package for artifact
        shell: powershell
        run: |
          # upload-artifact@v4 会多包一层 zip，所以需要把插件目录塞进中间父目录
          # 这样 artifact zip 内部就是: moeKoe-taskbar-lyrics/manifest.json (深度=2)
          # 恰好符合 MoeKoeMusic installPluginFromZip 的检测规则
          # x64 job 产完整包（根目录启动器 + x64/ 子目录）；arm64 job 只产 arm64/ 部分，
          # 由 release 流程合并为单包双架构。
          # 注意：Copy-Item 目标目录不可预创建，否则源会被整体嵌套进一层子目录
          New-Item -ItemType Directory -Path artifact-${{ matrix.arch }} -Force
          if ("${{ matrix.arch }}" -eq "x64") {
            Copy-Item -Path moeKoe-taskbar-lyrics -Destination artifact-x64/moeKoe-taskbar-lyrics -Recurse -Force
          } else {
            Copy-Item -Path moeKoe-taskbar-lyrics/arm64 -Destination artifact-arm64/moeKoe-taskbar-lyrics-arm64 -Recurse -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoeKoeTaskbarLyrics-${{ matrix.arch }}
          path: artifact-${{ matrix.arch }}/
