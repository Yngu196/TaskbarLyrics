name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # 手动触发构建（不经过 check 每日限流，用于验证修复等场景）
  workflow_dispatch:

jobs:
  # 每天仅当日第一次 push 触发构建；pull_request 不受限制
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      skip: ${{ steps.check_today.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Check today's build status
        id: check_today
        shell: bash
        run: |
          today=$(date -u +%Y-%m-%d)
          runs=$(gh run list --branch "${{ github.ref_name }}" --workflow build.yml --limit 20 --json status,createdAt --jq "[.[] | select(.status == \"completed\" and (.createdAt | startswith(\"$today\")))] | length")
          if [ "$runs" -gt 0 ]; then
            echo "Today's build already completed ($runs run(s) found). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No completed build found for today. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check
    if: |
      always() &&
      (github.event_name != 'push' || needs.check.outputs.skip != 'true')
    runs-on: windows-latest
    # 最后一道护栏：任何未在步骤内自行超时的步骤（含未来新增的）都不能
    # 占满 GitHub 默认的 6 小时 job 上限。留给 vcpkg 编译足够余量。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 本地已初始化 submodule 走 ixwebsocket 源码编译；CI 必须走同一条路径，
          # 否则「CI 绿」不代表「本地绿」。
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Prepare dependencies (bootstrap)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Same dependency preparation entry point as a local checkout.
          # Write GITHUB_ENV first so a script 'return' cannot skip it.
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"
          $installDir = "$vcpkgRoot\installed\${{ matrix.arch }}-windows"
          "VCPKG_INSTALLED_DIR=$installDir" >> $env:GITHUB_ENV

          .\scripts\bootstrap.ps1 -Arch ${{ matrix.arch }} `
            -VcpkgRoot $vcpkgRoot `
            -VcpkgCommit '75672db6bd812b060482b0f00b5a16b18a0c0f07'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -B build-${{ matrix.arch }} -S . `
            -A ${{ matrix.arch }} `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-${{ matrix.arch }} --config Release -- /v:minimal

      - name: Test
        # ARM64 job runs on an x64 runner: its test binaries cannot execute here.
        if: matrix.arch == 'x64'
        # CMakeLists.txt 已给 HttpLifecycle 设 TIMEOUT=30；命令行保持同一数值，
        # 保证无论谁调用 ctest 都不会被一个挂住的测试拖到 job 上限。
        run: ctest --test-dir build-${{ matrix.arch }} -C Release --output-on-failure --timeout 30

      - name: Ensure VC++ Redist DLLs
        shell: pwsh
        run: |
          # CRT DLL 取自构建机自己的 Visual Studio 安装（vswhere 定位），不随仓库分发。
          # 脚本会打印全部候选目录、逐文件校验 PE 架构，仅在缺失/错架构时复制；
          # 找不到就明确失败，避免产物缺 CRT 却标 success。
          .\scripts\copy_vc_runtime.ps1 -Arch ${{ matrix.arch }} -Destination "moeKoe-taskbar-lyrics\${{ matrix.arch }}"

      - name: Package for artifact
        shell: powershell
        run: |
          # upload-artifact@v4 会多包一层 zip，所以需要把插件目录塞进中间父目录
          # 这样 artifact zip 内部就是: moeKoe-taskbar-lyrics/manifest.json (深度=2)
          # 恰好符合 MoeKoeMusic installPluginFromZip 的检测规则
          # x64 job 产完整包（根目录启动器 + x64/ 子目录）；arm64 job 只产 arm64/ 部分，
          # 由 release 流程合并为单包双架构。
          # 注意：Copy-Item 目标目录不可预创建，否则源会被整体嵌套进一层子目录
          New-Item -ItemType Directory -Path artifact-${{ matrix.arch }} -Force
          if ("${{ matrix.arch }}" -eq "x64") {
            Copy-Item -Path moeKoe-taskbar-lyrics -Destination artifact-x64/moeKoe-taskbar-lyrics -Recurse -Force
          } else {
            Copy-Item -Path moeKoe-taskbar-lyrics/arm64 -Destination artifact-arm64/moeKoe-taskbar-lyrics-arm64 -Recurse -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoeKoeTaskbarLyrics-${{ matrix.arch }}
          path: artifact-${{ matrix.arch }}/
