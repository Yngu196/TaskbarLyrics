name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # 手动触发构建（不经过 check 每日限流，用于验证修复等场景）
  workflow_dispatch:

jobs:
  # 当天已有「成功」构建才跳过后续 push；pull_request 不受限制
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      skip: ${{ steps.check_today.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Check today's successful build
        id: check_today
        shell: bash
        run: |
          today=$(date -u +%Y-%m-%d)
          # 只有 conclusion == "success" 才算当天已构建：cancelled / failure /
          # timed_out 不能锁死当天后续 push，否则一次挂起被取消后整天都无法
          # 再触发构建，修完问题也验证不了。
          runs=$(gh run list --branch "${{ github.ref_name }}" --workflow build.yml --limit 20 --json status,conclusion,createdAt --jq "[.[] | select(.status == \"completed\" and .conclusion == \"success\" and (.createdAt | startswith(\"$today\")))] | length")
          if [ "$runs" -gt 0 ]; then
            echo "Today's build already succeeded ($runs run(s) found). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful build found for today. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check
    if: |
      always() &&
      (github.event_name != 'push' || needs.check.outputs.skip != 'true')
    runs-on: windows-latest
    # 最后一道护栏：任何步骤都不能占满 GitHub 默认的 6 小时 job 上限。
    # 余量主要留给 vcpkg 首次编译；CI 不运行 ctest，测试超时由本地护栏负责。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 本地已初始化 submodule 走 ixwebsocket 源码编译；CI 必须走同一条路径，
          # 否则「CI 绿」不代表「本地绿」。
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Prepare dependencies (bootstrap)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Same dependency preparation entry point as a local checkout.
          # bootstrap writes .vcpkgroot; the configure step reads that pin,
          # so CI exercises exactly the same resolution path as a developer.
          # Do NOT set VCPKG_INSTALLED_DIR: an override would bypass the pin
          # and hide regressions in the build contract.
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"
          .\scripts\bootstrap.ps1 -Arch ${{ matrix.arch }} `
            -VcpkgRoot $vcpkgRoot `
            -VcpkgCommit '75672db6bd812b060482b0f00b5a16b18a0c0f07'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure CMake
        shell: powershell
        run: |
          # VCPKG_INSTALLED_DIR is deliberately not passed: CMake resolves
          # .vcpkgroot written by bootstrap.ps1, same as build.cmd / VS IDE.
          # BUILD_TESTING is deliberately not passed either: CMakeLists.txt
          # defaults it to OFF, so CI neither downloads Catch2 nor builds or
          # runs test binaries. Unit tests are a local, opt-in capability.
          cmake -B build-${{ matrix.arch }} -S . `
            -A ${{ matrix.arch }} `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-${{ matrix.arch }} --config Release -- /v:minimal

      - name: Ensure VC++ Redist DLLs
        shell: pwsh
        run: |
          # CRT DLL 取自构建机自己的 VS 安装；本机缺 ARM64 retail CRT 时，
          # 脚本自动下载微软官方 VC_redist.arm64.exe 并从中提取，不随仓库分发。
          # 逐文件校验 PE 架构，仅在缺失/错架构时复制；找不到就明确失败。
          .\scripts\copy_vc_runtime.ps1 -Arch ${{ matrix.arch }} -Destination "moeKoe-taskbar-lyrics\${{ matrix.arch }}"

      - name: Package for artifact
        shell: powershell
        run: |
          # upload-artifact@v4 会多包一层 zip，所以需要把插件目录塞进中间父目录
          # 这样 artifact zip 内部就是: moeKoe-taskbar-lyrics/manifest.json (深度=2)
          # 恰好符合 MoeKoeMusic installPluginFromZip 的检测规则
          # x64 job 产完整包（根目录启动器 + x64/ 子目录）；arm64 job 只产 arm64/ 部分，
          # 由 release 流程合并为单包双架构。
          # 注意：Copy-Item 目标目录不可预创建，否则源会被整体嵌套进一层子目录
          New-Item -ItemType Directory -Path artifact-${{ matrix.arch }} -Force
          if ("${{ matrix.arch }}" -eq "x64") {
            Copy-Item -Path moeKoe-taskbar-lyrics -Destination artifact-x64/moeKoe-taskbar-lyrics -Recurse -Force
          } else {
            Copy-Item -Path moeKoe-taskbar-lyrics/arm64 -Destination artifact-arm64/moeKoe-taskbar-lyrics-arm64 -Recurse -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoeKoeTaskbarLyrics-${{ matrix.arch }}
          path: artifact-${{ matrix.arch }}/
