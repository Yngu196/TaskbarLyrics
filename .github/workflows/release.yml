name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来获取上一个 tag

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install dependencies (vcpkg)
        shell: powershell
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"

          if (!(Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            git -C $vcpkgRoot checkout 75672db6bd812b060482b0f00b5a16b18a0c0f07
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }

          & "$vcpkgRoot\vcpkg.exe" install ixwebsocket nlohmann-json zlib mbedtls kissfft --triplet ${{ matrix.arch }}-windows --classic
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $installDir = "$vcpkgRoot\installed\${{ matrix.arch }}-windows"
          Write-Host "VCPKG_INSTALLED_DIR=$installDir"
          echo "VCPKG_INSTALLED_DIR=$installDir" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -B build-${{ matrix.arch }} -S . `
            -A ${{ matrix.arch }} `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-${{ matrix.arch }} --config Release -- /v:minimal

      - name: Copy VC++ Redist DLLs
        shell: powershell
        run: |
          # 从编译器路径推导 VC Redist CRT 目录
          $clPath = (Get-Command cl.exe -ErrorAction SilentlyContinue).Source
          if ($clPath) {
            # cl.exe: .../VC/Tools/MSVC/<ver>/bin/Hostx64/<arch>/cl.exe
            $vcRoot = (Split-Path (Split-Path (Split-Path (Split-Path (Split-Path $clPath)))))  # .../VC
            $msvcVer = (Split-Path (Split-Path (Split-Path (Split-Path $clPath))) | Split-Path -Leaf)  # <ver>
            $arch = "${{ matrix.arch }}"
            $crtDir = Join-Path $vcRoot "Redist\MSVC\$msvcVer\$arch\Microsoft.VC143.CRT"
            if (!(Test-Path $crtDir)) {
              $crtDir = Join-Path $vcRoot "Redist\MSVC\$msvcVer\onecore\$arch\Microsoft.VC143.CRT"
            }
            if (Test-Path $crtDir) {
              Write-Host "Copying VC++ CRT DLLs from: $crtDir"
              Copy-Item -Path "$crtDir\msvcp140.dll" -Destination "moeKoe-taskbar-lyrics\${{ matrix.arch }}\" -Force
              Copy-Item -Path "$crtDir\vcruntime140.dll" -Destination "moeKoe-taskbar-lyrics\${{ matrix.arch }}\" -Force
              Copy-Item -Path "$crtDir\vcruntime140_1.dll" -Destination "moeKoe-taskbar-lyrics\${{ matrix.arch }}\" -Force
              Write-Host "VC++ CRT DLLs copied successfully"
            } else {
              Write-Host "WARNING: VC++ CRT directory not found at $crtDir"
              # Fallback: search System32
              $sys32 = "$env:SystemRoot\System32"
              foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
                $src = Join-Path $sys32 $dll
                if (Test-Path $src) {
                  Copy-Item -Path $src -Destination "moeKoe-taskbar-lyrics\${{ matrix.arch }}\" -Force
                  Write-Host "Copied $dll from System32"
                }
              }
            }
          } else {
            Write-Host "WARNING: cl.exe not found, cannot locate VC++ Redist"
          }

      - name: Package
        shell: powershell
        run: |
          # 上传目录 artifact（不在此处打 zip）：release job 合并 x64 完整包 + arm64 部分
          # 后统一 pack_zip，产出单包双架构 zip。
          # x64 job 产完整包（根目录启动器 + x64/ 子目录）；arm64 job 只产 arm64/ 部分。
          # 注意：Copy-Item 目标目录不可预创建，否则源会被整体嵌套进一层子目录
          if ("${{ matrix.arch }}" -eq "x64") {
            New-Item -ItemType Directory -Path artifact-x64 -Force
            Copy-Item -Path moeKoe-taskbar-lyrics -Destination artifact-x64/moeKoe-taskbar-lyrics -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path artifact-arm64 -Force
            Copy-Item -Path moeKoe-taskbar-lyrics/arm64 -Destination artifact-arm64/moeKoe-taskbar-lyrics-arm64 -Recurse -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moeKoe-taskbar-lyrics-${{ matrix.arch }}
          path: artifact-${{ matrix.arch }}/
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来获取上一个 tag

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge dual-arch package
        shell: pwsh
        run: |
          # dist/ 由 merge-multiple 展开两个 artifact：
          #   dist/moeKoe-taskbar-lyrics/        <- x64 job（根目录启动器 + x64/）
          #   dist/moeKoe-taskbar-lyrics-arm64/  <- arm64 job（arm64/ 内容）
          # 把 arm64 部分并入完整包 → 单包双架构，然后统一打 zip。
          if (Test-Path "dist/moeKoe-taskbar-lyrics-arm64") {
            # 目标不预创建：Copy-Item 目录时目标不存在会平铺内容，预创建会整体嵌套一层
            Copy-Item -Path dist/moeKoe-taskbar-lyrics-arm64 -Destination dist/moeKoe-taskbar-lyrics/arm64 -Recurse -Force
            Remove-Item -Path dist/moeKoe-taskbar-lyrics-arm64 -Recurse -Force
          }
          python scripts/pack_zip.py dist/moeKoe-taskbar-lyrics dist/moeKoe-taskbar-lyrics.zip

      - name: Extract changelog for this version
        id: changelog
        # 必须使用 pwsh（PowerShell 7）：GitHub Actions 将 run 块写入无 BOM 的
        # UTF-8 脚本文件，Windows PowerShell 5.1 会按 ANSI 读取，导致中文路径
        # （Docs\版本更新日志.md）变成乱码、Test-Path 失败，生成空 Release notes
        # （v1.0.3 曾因此触发）。
        shell: pwsh
        run: |
          # 从 tag 获取版本号（去掉 v 前缀）
          $tag = "${{ github.ref_name }}"
          Write-Host "Extracting changelog for version: $tag"

          $changelogFile = "Docs\版本更新日志.md"
          if (!(Test-Path -LiteralPath $changelogFile)) {
            Write-Host "WARNING: Changelog file not found"
            echo "body=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $content = Get-Content -LiteralPath $changelogFile -Raw -Encoding UTF8
          $lines = $content -split "`n"

          # 查找 "## vX.Y.Z 变更" 标题行
          # 转义 tag 中的 "."，避免被当作正则通配符
          $headerPattern = "^## " + [regex]::Escape($tag) + " 变更"
          $nextHeaderPattern = "^## v\d+\.\d+\.\d+"

          $startIdx = -1
          $endIdx = $lines.Count

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $headerPattern) {
              $startIdx = $i
              continue
            }
            # 找到起始行后，下一个 ## v 标题就是结束
            if ($startIdx -ge 0 -and $i -gt $startIdx -and $lines[$i] -match $nextHeaderPattern) {
              $endIdx = $i
              break
            }
          }

          if ($startIdx -lt 0) {
            Write-Host "WARNING: No changelog entry found for $tag"
            echo "body=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # 提取该版本的内容（去掉标题行本身）
          $versionNotes = ($lines[($startIdx+1)..($endIdx-1)]) -join "`n"
          $versionNotes = $versionNotes.TrimEnd()

          # 获取上一个版本的 tag（用于 Full Changelog 链接）
          $repo = "${{ github.repository }}"
          $allTags = @(git tag --sort=-version:refname |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { $_.Trim() })
          $prevTagStr = $allTags | Where-Object { $_ -ne $tag } | Select-Object -First 1

          # 构建 release body：版本更新日志 + Full Changelog 链接
          $fullChangelogLink = ""
          if ($prevTagStr) {
            $fullChangelogLink = "`n`n---`n`n**Full Changelog**: [$prevTagStr...$tag](https://github.com/$repo/compare/$prevTagStr...$tag)"
          }

          $body = $versionNotes + $fullChangelogLink

          # 写入多行输出（使用 GITHUB_OUTPUT 分隔符语法）
          $delimiter = "CHANGELOG_EOF"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

          Write-Host "Changelog extracted successfully"
          Write-Host "--- Preview ---"
          Write-Host $body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
